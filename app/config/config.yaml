app:
  name: "AI News Rewriter"
  language: "ru"
  timezone: "Europe/Moscow"

llm:
  # Дефолт — Groq: на этой машине (8 ГБ RAM, без дискретной GPU, i3-1215U) локальная
  # Ollama гоняет модель на CPU и выдаёт >60с на вызов — непригодно для боевого режима.
  # Ollama вернётся дефолтом, когда появится сервер с GPU (см. Инварианты в CLAUDE.md).
  provider: "groq"
  host: "http://localhost:11434"    # используется только при provider: "ollama"
  model: "llama-3.1-8b-instant"
  api_key_env: "GROQ_API_KEY"       # gemini/openrouter -> GEMINI_API_KEY/OPENROUTER_API_KEY
  # Резервные модели ТОГО ЖЕ провайдера: при отказе основной (429/лимит) клиент
  # по очереди пробует их. Список должен соответствовать активному provider.
  fallback_models:
    - "llama-3.3-70b-versatile"
  # Vision-модель для detect_foreign_watermark (проверка чужих логотипов/подписей
  # "Источник: ..." на фото поста перед публикацией) — подтверждена доступной на
  # этом Groq-аккаунте 2026-07-04. Пусто = проверка выключена.
  vision_model: "meta-llama/llama-4-scout-17b-16e-instruct"
  temperature: 0.7
  top_p: 0.9
  timeout_seconds: 60
  retries: 1
  # --- Пример для OpenRouter (бесплатные модели часто отдают 429 — ротация помогает):
  # provider: "openrouter"
  # model: "meta-llama/llama-3.3-70b-instruct:free"
  # api_key_env: "OPENROUTER_API_KEY"
  # fallback_models:
  #   - "qwen/qwen3-next-80b-a3b-instruct:free"
  #   - "openai/gpt-oss-120b:free"
  #   - "google/gemma-4-31b-it:free"
  #   - "nvidia/nemotron-3-super-120b-a12b:free"

monitoring:
  # Проверка каждый час — бот берёт самую свежую новость и сразу публикует
  # (2026-07-05, явный запрос пользователя: "бот проверяет каналы каждый час,
  # видит новую новость, переделывает и публикует; новости всегда свежие, не
  # надо лимитов каждые два часа"). Интервал публикации (schedule.min_interval_
  # minutes = 55) НАМЕРЕННО меньше часа, чтобы штатная часовая проверка никогда
  # не блокировалась антиспам-guard — 55 мин остаётся только как защита от
  # случайного двойного постинга при передеплое (см. историю 28 повторов), не
  # как троттл на темп пользователя.
  check_interval_minutes: 60
  # 24 часа (было 168/7 дней) — явный запрет пользователя 2026-07-04 на старые
  # новости: "бери всегда свежие новости, а не старые, только свежие". 7-дневное
  # окно позволяло попадать в очередь недельной давности событиям, которые потом
  # публиковались как будто свежие.
  max_post_age_hours: 24
  fetch_batch_size: 50

sources:
  telegram: []
  vk: []

filters:
  # Порог был откалиброван в предположении, что keyword_match (25% веса) почти всегда
  # даёт вклад — но при пустом/неполном совпадении whitelist_keywords реальный потолок
  # скора без совпадения ~70-75 даже для действительно хороших новостей (подтверждено
  # эмпирически 2026-07-02: реальный пост с news_value~90 набрал только 66.38). Снижено
  # до реалистичного порога.
  min_score: 55
  important_score_threshold: 65  # выше — «главные» посты (6/день), ниже — «обычные» (6/день)
  duplicate_similarity_threshold: 0.85
  min_views: 500
  stop_words:
    # базовый набор из раздела 8.1 SPEC.md
    - "скидка"
    - "промокод"
    - "акция"
    - "купить"
    - "заказать"
    - "партнёрский материал"
    - "реклама"
    - "интеграция"
    - "переходите по ссылке"
    - "подписывайтесь"
    - "розыгрыш"
    - "конкурс"
    # выявлено на реальных примерах нативной/партнёрской рекламы (2026-07-01)
    - "перейдите по ссылке"
    - "vk.cc/"
    - "vk.com/app"
    - "wildberries.ru/catalog"
    - "артикул"
    - "бесплатный доступ"
    - "чтобы начать тест"
    - "заработок на"
    - "без вложений"
    - "партнёрские ссылки"
  required_keywords_boost: true
  # базовый список из раздела 8.2 SPEC.md + тематика реальных источников проекта
  # (без него keyword_match всегда 0 — это 25% веса скоринга, недостижимый min_score)
  whitelist_keywords:
    - "Россия"
    - "Москва"
    - "Кремль"
    - "Путин"
    - "Президент"
    - "Правительство"
    - "Госдума"
    - "Армия"
    - "Минобороны"
    - "Экономика"
    - "Санкции"
    - "Рубль"
    - "Доллар"
    - "Нефть"
    - "Газ"
    - "НАТО"
    - "США"
    - "Европа"
    - "Китай"
    - "Закон"
    - "Суд"
    - "МВД"
    - "ФСБ"
    - "МЧС"
    - "Катастрофа"
    - "Происшествие"
    - "Apple"
    - "iPhone"
    - "Samsung"
    - "Google"
    - "Microsoft"
    - "VK"
    - "Telegram"
    - "смартфон"
    - "чип"
    - "процессор"
  blacklist_keywords: []

scoring:
  weights:
    news_value: 0.35
    keyword_match: 0.25
    source_views: 0.20
    freshness: 0.10
    source_priority: 0.10

rewrite:
  style: "viral"
  max_length_chars: 900
  headline_variants: 3
  include_hashtags: false  # LLM их всё равно генерирует, просто не публикуем — можно включить

images:
  providers_order: ["source", "unsplash", "pexels", "pixabay"]
  # 1, не 3 — по запросу пользователя 2026-07-05 ("зачем берёшь по 3 стоковых
  # фото, бери только одно, как в оригинале").
  count_per_post: 1
  target_aspect_ratio: "4:5"
  # Уникализация при репосте: фото — лёгкий кроп + шум + удаление метаданных (EXIF);
  # видео — микро eq (яркость/контраст/насыщенность/гамма) + крошечный кроп-и-масштаб
  # обратно, детерминированно по post_id (см. app/core/media/uniquifier.py) — встроено
  # в тот же ffmpeg-проход, что и watermark, качество не теряется дважды. Один тумблер
  # на оба типа медиа. Цель — снизить перцептивное совпадение с оригиналом поста.
  # Значения намеренно малы (глазом не видны). enabled: false — только watermark.
  uniquify:
    enabled: true
    crop_percent: 1.0
    noise_sigma: 3.0

watermark:
  logo_path: "assets/logo.png"
  position: "top-right"
  opacity: 65
  margin_px: 20
  size_ratio: 0.17

# Монтаж фото в стиле PostNews (запрос пользователя 2026-07-05, реф. прислан) —
# зелёное свечение в двух углах на КАЖДОМ фото + жирный заголовок белым внизу
# ТОЛЬКО на первом фото. Логотип-вотермарк — отдельно (секция watermark выше).
headline_card:
  enabled: true
  corner_fade_color: [22, 200, 120]           # зелёный (реф. синий у PostNews)
  corner_fade_corners: ["bottom-left", "top-right"]  # нижний-левый + верхний-правый
  corner_fade_max_alpha: 0.92                   # насыщенность свечения у угла (0..1)
  corner_fade_radius_ratio: 1.05               # как далеко к центру доходит свечение
  band_color: [6, 40, 26]                      # тёмно-зелёная полоса под заголовком
  font_path: "assets/fonts/DejaVuSans-Bold.ttf"
  font_size_ratio: 0.065
  band_height_ratio: 0.35
  margin_px: 32
  text_color: [255, 255, 255]

publishing:
  targets:
    telegram:
      enabled: true
      bot_token_env: "TG_BOT_TOKEN"
      chat_id: "@NewsThreeWord"
    vk:
      enabled: true
      token_env: "VK_GROUP_TOKEN"
      group_id: 233689032
  schedule:
    mode: "fixed_slots"
    # fixed_slots — только для справки/режима отдельного планировщика; headless
    # использует check_interval_minutes (interval-триггер), не эти слоты.
    fixed_slots:
      ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00",
       "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]
    interval_minutes: 60
    # 30 постов/день, ~1/час — по запросу пользователя 2026-07-05 «не надо лимитов,
    # публикуй свежее сразу». Ослабление антиспам-guard сделано по ЯВНОМУ запросу
    # (инвариант в CLAUDE.md это допускает только так). Риск: именно частый постинг
    # ранее вызвал бан VK — но тогда банил ручной batch-скрипт В ОБХОД планировщика,
    # а не штатное учащение через config (см. CLAUDE.md, История решений). Часовой
    # штатный темп на порядок безопаснее пачки, но следить за реакцией VK.
    max_posts_per_day: 30
    min_interval_minutes: 55   # не троттл темпа (55 < 60 мин проверки, штатный час
    # никогда не блокируется), а защита от двойного постинга при передеплое/гонке
    jitter_minutes: 5          # ±5 мин разброса цикла ПРОВЕРКИ (не публикации)
    # Публикуем только свежее: самый свежий пост очереди старше 4ч → не публикуем,
    # старьё протухает. Убирает "публикуются старые новости" (запрос 2026-07-05).
    publish_freshness_hours: 4

logging:
  level: "INFO"
  max_file_size_mb: 10
  backup_count: 5

footer:
  # Выключено по запросу пользователя 2026-07-04: VK-скобочная разметка [url|текст]
  # не создаёт кликабельную ссылку для внешних доменов (t.me) — показывает как есть.
  # Пока публикуем только медиа+текст, без ссылок вообще (в любую сеть).
  enabled: false
  label: "Подписывайтесь на нас"
  telegram_url: "https://t.me/NewsThreeWord"
  vk_url: "https://vk.com/club233689032"
