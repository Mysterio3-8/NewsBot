app:
  name: "AI News Rewriter"
  language: "ru"
  timezone: "Europe/Moscow"

llm:
  # Дефолт — Groq: на этой машине (8 ГБ RAM, без дискретной GPU, i3-1215U) локальная
  # Ollama гоняет модель на CPU и выдаёт >60с на вызов — непригодно для боевого режима.
  # Ollama вернётся дефолтом, когда появится сервер с GPU (см. Инварианты в CLAUDE.md).
  provider: "groq"
  host: "http://localhost:11434"    # используется только при provider: "ollama"
  model: "llama-3.1-8b-instant"
  api_key_env: "GROQ_API_KEY"       # gemini/openrouter -> GEMINI_API_KEY/OPENROUTER_API_KEY
  # Резервные модели ТОГО ЖЕ провайдера: при отказе основной (429/лимит) клиент
  # по очереди пробует их. Список должен соответствовать активному provider.
  fallback_models:
    - "llama-3.3-70b-versatile"
  # Vision-модель для detect_foreign_watermark (проверка чужих логотипов/подписей
  # "Источник: ..." на фото поста перед публикацией) — подтверждена доступной на
  # этом Groq-аккаунте 2026-07-04. Пусто = проверка выключена.
  vision_model: "meta-llama/llama-4-scout-17b-16e-instruct"
  temperature: 0.7
  top_p: 0.9
  timeout_seconds: 60
  retries: 1
  # --- Пример для OpenRouter (бесплатные модели часто отдают 429 — ротация помогает):
  # provider: "openrouter"
  # model: "meta-llama/llama-3.3-70b-instruct:free"
  # api_key_env: "OPENROUTER_API_KEY"
  # fallback_models:
  #   - "qwen/qwen3-next-80b-a3b-instruct:free"
  #   - "openai/gpt-oss-120b:free"
  #   - "google/gemma-4-31b-it:free"
  #   - "nvidia/nemotron-3-super-120b-a12b:free"

antiban:
  # ЖЁСТКИЙ лимит на ЛИЧНЫЙ VK-токен (VK_USER_TOKEN/VK_PHOTO_UPLOAD_TOKEN) — явный
  # запрос пользователя 2026-07-10: "даже если публикация будет идти через 10 минут,
  # главное бана избежать". Личный аккаунт админит сразу 3 проекта — его бан валит
  # доступ ко всем. Минимум между ОПЕРАЦИЯМИ личного токена (один вызов wall.get на
  # чтение источника, ОДНА загрузка медиа поста целиком) — НЕ между сырыми VK API
  # вызовами внутри одной загрузки (там нужен быстрый технический лимит 2/сек, иначе
  # рвётся upload_url, см. token_bucket.py). Групповой токен (публикация текста) этим
  # не ограничен — VK сам рекомендует групповые токены как санкционированный путь
  # автоматизации. 0 — отключить (не рекомендуется).
  vk_personal_token_cooldown_seconds: 600

monitoring:
  # Мониторинг идёт по last_processed_message_id (курсор в settings), а не по времени
  # публикации — поэтому пропусков пачки нет: если между проверками вышло 4 поста, на
  # следующем чеке берём ВСЕ 4 по порядку ID, а не только самый свежий (см.
  # telegram_fetcher.fetch_new_posts). Раз в 6 часов (запрос пользователя 2026-07-10):
  # курсор не теряет посты между проверками, поэтому частый опрос не нужен — на каждом
  # чеке добираем весь бэклог с id > курсора. Первый цикл стартует сразу при запуске.
  check_interval_minutes: 360
  # 24 часа (было 168/7 дней) — явный запрет пользователя 2026-07-04 на старые
  # новости: "бери всегда свежие новости, а не старые, только свежие". 7-дневное
  # окно позволяло попадать в очередь недельной давности событиям, которые потом
  # публиковались как будто свежие.
  max_post_age_hours: 24
  fetch_batch_size: 50

sources:
  telegram: []
  vk: []

filters:
  # Порог был откалиброван в предположении, что keyword_match (25% веса) почти всегда
  # даёт вклад — но при пустом/неполном совпадении whitelist_keywords реальный потолок
  # скора без совпадения ~70-75 даже для действительно хороших новостей (подтверждено
  # эмпирически 2026-07-02: реальный пост с news_value~90 набрал только 66.38). Снижено
  # до реалистичного порога.
  min_score: 55
  important_score_threshold: 65  # выше — «главные» посты (6/день), ниже — «обычные» (6/день)
  duplicate_similarity_threshold: 0.85
  min_views: 500
  stop_words:
    # базовый набор из раздела 8.1 SPEC.md
    - "скидка"
    - "промокод"
    - "акция"
    - "купить"
    - "заказать"
    - "партнёрский материал"
    - "реклама"
    - "интеграция"
    - "переходите по ссылке"
    - "подписывайтесь"
    - "розыгрыш"
    - "конкурс"
    # выявлено на реальных примерах нативной/партнёрской рекламы (2026-07-01)
    - "перейдите по ссылке"
    - "vk.cc/"
    - "vk.com/app"
    - "wildberries.ru/catalog"
    - "артикул"
    - "бесплатный доступ"
    - "чтобы начать тест"
    - "заработок на"
    - "без вложений"
    - "партнёрские ссылки"
  required_keywords_boost: true
  # базовый список из раздела 8.2 SPEC.md + тематика реальных источников проекта
  # (без него keyword_match всегда 0 — это 25% веса скоринга, недостижимый min_score)
  whitelist_keywords:
    - "Россия"
    - "Москва"
    - "Кремль"
    - "Путин"
    - "Президент"
    - "Правительство"
    - "Госдума"
    - "Армия"
    - "Минобороны"
    - "Экономика"
    - "Санкции"
    - "Рубль"
    - "Доллар"
    - "Нефть"
    - "Газ"
    - "НАТО"
    - "США"
    - "Европа"
    - "Китай"
    - "Закон"
    - "Суд"
    - "МВД"
    - "ФСБ"
    - "МЧС"
    - "Катастрофа"
    - "Происшествие"
    - "Apple"
    - "iPhone"
    - "Samsung"
    - "Google"
    - "Microsoft"
    - "VK"
    - "Telegram"
    - "смартфон"
    - "чип"
    - "процессор"
  blacklist_keywords: []

scoring:
  weights:
    news_value: 0.35
    keyword_match: 0.25
    source_views: 0.20
    freshness: 0.10
    source_priority: 0.10

rewrite:
  style: "viral"
  max_length_chars: 900
  headline_variants: 3
  include_hashtags: false  # LLM их всё равно генерирует, просто не публикуем — можно включить

images:
  # keep_original: false (2026-07-11, явный запрос пользователя — увидел в каналах
  # фото 1-в-1 с исходником без нашего лого, "взял в наглую оригинал"). Было true с
  # 2026-07-07 ("лёгкий режим"): медиа публиковались оригиналами как есть, без вотермарка.
  # Теперь на все фото (свои и сток) снова накладывается лого (Watermarker._overlay_logo,
  # безусловно в этой ветке). Монтаж (headline_card ниже, зелёное свечение+заголовок)
  # остаётся выключен ОТДЕЛЬНЫМ флагом — не включается этим переключателем.
  keep_original: false
  providers_order: ["source", "unsplash", "pexels", "pixabay"]
  count_per_post: 1
  target_aspect_ratio: "1:1"
  # Уникализация при репосте: фото — лёгкий кроп + шум + удаление метаданных (EXIF);
  # видео — микро eq (яркость/контраст/насыщенность/гамма) + крошечный кроп-и-масштаб
  # обратно, детерминированно по post_id (см. app/core/media/uniquifier.py) — встроено
  # в тот же ffmpeg-проход, что и watermark, качество не теряется дважды. Один тумблер
  # на оба типа медиа. Цель — снизить перцептивное совпадение с оригиналом поста.
  # Значения намеренно малы (глазом не видны). enabled: false — только watermark.
  uniquify:
    enabled: false   # лёгкий режим: медиа как есть, без уникализации (keep_original)
    crop_percent: 1.0
    noise_sigma: 3.0

watermark:
  logo_path: "assets/logo.png"
  position: "top-right"
  opacity: 65
  margin_px: 20
  size_ratio: 0.17
  video_enabled: false   # на видео вотермарк/монтаж НЕ ставим (запрос 2026-07-05)

# Монтаж фото в стиле PostNews (зелёное свечение + заголовок на первом фото).
# ВЫКЛЮЧЕН в лёгком режиме (keep_original) — «прикольная штука, доработаем потом»
# (запрос пользователя 2026-07-07). Код монтажа остаётся, вернуть = enabled: true
# + images.keep_original: false.
headline_card:
  enabled: false
  corner_fade_color: [22, 200, 120]           # зелёный (реф. синий у PostNews)
  corner_fade_corners: ["bottom-left", "top-right"]  # нижний-левый + верхний-правый
  corner_fade_max_alpha: 0.74                   # насыщенность свечения (снижено ~20% по запросу)
  corner_fade_radius_ratio: 1.05               # как далеко к центру доходит свечение
  band_color: [6, 40, 26]                      # тёмно-зелёная полоса под заголовком
  font_path: "assets/fonts/DejaVuSans-Bold.ttf"
  font_size_ratio: 0.065
  band_height_ratio: 0.35
  margin_px: 32
  text_color: [255, 255, 255]

publishing:
  targets:
    telegram:
      enabled: true
      bot_token_env: "TG_BOT_TOKEN"
      chat_id: "@NewsThreeWord"
    vk:
      enabled: true
      token_env: "VK_GROUP_TOKEN"
      group_id: 233689032
  schedule:
    mode: "fixed_slots"
    # fixed_slots — только для справки/режима отдельного планировщика; headless
    # использует check_interval_minutes (interval-триггер), не эти слоты.
    fixed_slots:
      ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00",
       "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"]
    interval_minutes: 20
    # БЕЗ ЛИМИТА (запрос пользователя 2026-07-07: "публиковать всё без лимита,
    # сразу"). max_posts_per_day: 999 и min_interval_minutes: 0 фактически снимают
    # дневной лимит и пол интервала. Антиспам-стопор (rate_guard) при этом ОСТАЁТСЯ
    # включённым: он всё ещё блокирует повторную публикацию одного поста в ТУ ЖЕ
    # сеть (тот баг с 28 повторами в TG, 2026-07-05) и разрешает только законный
    # кросс-пост TG→VK. Снято именно ограничение частоты/объёма — по инварианту
    # CLAUDE.md это допускается лишь по явному запросу пользователя. РИСК: частота+
    # объём ранее банили VK — вернуть лимит = поднять эти два числа обратно.
    max_posts_per_day: 999
    min_interval_minutes: 0
    jitter_minutes: 1          # ±1 мин к циклу проверки (база 2 мин)
    # Окно свежести/бэклога: посты старше этого окна протухают (не публикуются как
    # свежие). В режиме немедленной публикации почти всё уходит в тот же цикл, окно
    # держит очередь от накопления древних постов при простое.
    publish_freshness_hours: 12

logging:
  level: "INFO"
  max_file_size_mb: 10
  backup_count: 5

footer:
  # Подписи по сетям (ТЗ 2026-07-10): TG — фирменная гиперссылка на канал,
  # VK/Instagram — призыв подписаться на Telegram + голый (кликабельный) URL.
  # ВНИМАНИЕ: пока глобальный (один на все каналы). Включать (enabled: true) только
  # после пер-канальной привязки футера — иначе кино/мемы в VK получат ссылку на
  # НОВОСТНОЙ TG-канал. Голый URL для VK решает старую проблему нелинкующихся скобок.
  enabled: false
  label: "Подписывайтесь на нас"
  telegram_url: "https://t.me/NewsThreeWord"
  vk_url: "https://vk.com/club233689032"
  telegram_signature: "🔢 Новости в трёх словах"
  subscribe_cta: "Подписывайтесь на Telegram-канал:"
